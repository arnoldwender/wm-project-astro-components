# Build configuration for astro.wendermedia.com
#
# Dieses Repo ist eine Komponenten-Bibliothek (npm-Paket
# @wendermedia/astro-components), KEINE Astro-Site: es gibt weder ein
# `build`-Script noch eine astro.config.mjs, und damit auch kein dist/.
# Was die Domain ausliefert, ist der Storybook-Showcase.
#
# Die UI-Einstellung stand auf `npm run tokens:build` mit publish `dist`.
# tokens:build erzeugt nur die Design-Tokens unter tokens/dist/ — das
# Verzeichnis dist/ entsteht dabei nie, deshalb brach der Deploy mit
# "Deploy directory 'dist' does not exist" ab.
#
# Ein `netlify.toml` im Repo hat Vorrang vor der UI, damit die Einstellung
# versioniert ist und nicht wieder still auseinanderlaeuft.

[build]
  # tokens:build zuerst — Storybook zieht die generierten Tokens. Danach schreibt
  # scripts/storybook-static-landing.mjs Titel, Beschreibung, Canonical, Entität, den
  # Impressum-Link und den <noscript>-Text in storybook-static/index.html (bricht ab,
  # wenn die Shell nicht passt).
  command = "npm run tokens:build && npm run build-storybook && node scripts/storybook-static-landing.mjs"
  publish = "storybook-static"

[build.environment]
  # package.json engines verlangt >=22.12.0
  NODE_VERSION = "24"

# /datenschutz lleva a la sección Datenschutz de /impressum.html (mismo dominio, no es un 301 cross-domain).
# Por qué (06.11.2026): la Datenschutzerklärung vive como sección de impressum.html; quien la busca en su
# ruta habitual recibía 404 (lo marcó la auditoría legal de Netlify de ese día como «sin Datenschutz»).
[[redirects]]
  from = "/datenschutz"
  to = "/impressum.html#datenschutz"
  status = 301

[[redirects]]
  from = "/datenschutz/"
  to = "/impressum.html#datenschutz"
  status = 301

[[redirects]]
  from = "/datenschutz.html"
  to = "/impressum.html#datenschutz"
  status = 301
